name: Portfolio

on:
    push:
        branches: [main]

    workflow_dispatch:

#permissions:
   # pages: write # to deploy to Github pages\
    #id-token: write # to authenticate with the github token for deployment

permissions:
    contents: read
    pages: write
    id-token: write

jobs:
    deploy:
        runs-on: ubuntu-latest

        environment: 
            name: github-pages
            url: ${{steps.deployment.outputs.page_url}}
        steps:
            # get access to your portfolio code via a pre-built action that checks out your code
            # clone or checkout the code where this workflow is written
            # step 1: checkout the code from the repository
            - name: checkout code
              uses: actions/checkout@v4
            # Upload the static site before deploying it.
            - name: upload static files
              uses: actions/upload-pages-artifact@v4
              with:
                path: "./src/index.html"

            # Make the page live.
            - name: deploy to github pages 
              id: deployment
              uses: actions/deploy-pages@v4





